name: pinspire
description: Public-ready Pinterest-style discovery app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.5.0
  dio: ^5.8.0+1
  gal: ^2.3.1
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
